name: Test and Validate

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup de Node.js v22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. Setup de Java (Requerido para Firebase Emulators)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Instalación de dependencias
      - name: Install dependencies
        run: npm ci

      # 5. Verificación de Build
      - name: Verify build
        run: npm run build

      # 6. Tests Unitarios
      - name: Run unit tests
        run: npm run test:unit

      # 7. Iniciar Firebase Emulators
      - name: Start Firebase Emulators
        run: |
          npm install -g firebase-tools
          firebase emulators:exec "echo 'Emulators ready'" --project demo-test &
          sleep 10
        env:
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIRESTORE_EMULATOR_HOST: localhost:8080

      # 8. Tests de Integración con Firebase Emulators
      - name: Run integration tests
        run: npm run test:integration
        env:
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIRESTORE_EMULATOR_HOST: localhost:8080
          VITE_USE_EMULATOR: true

      # 9. Subir reporte de coverage como artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      # 10. Subir logs de test como artifact (para debugging)
      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-logs
          path: |
            vitest.setup.js
            package.json
          retention-days: 7